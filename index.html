<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Office Disgrace: It's Monday. Again.</title>
<style>
  :root{
    --bg:#d9d4c3; --panel:#efe9d6; --ink:#2b2a26; --muted:#6d685c; --line:#b7b09a;
    --accent:#2f5d50; --warn:#a4452c; --gold:#b98a2a; --screen:#1f2a22; --glow:#9fe0a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overscroll-behavior:none}
  body{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 6px)}
  .wrap{max-width:620px;margin:0 auto;padding:10px 12px 30px}
  h1{font-family:'Courier New',monospace;letter-spacing:.06em;margin:.2em 0 0;font-size:2rem;text-transform:uppercase}
  .tag{font-style:italic;color:var(--muted);margin:.2em 0 1em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:10px 0;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .btn{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;background:#fffdf4;border:1px solid var(--line);border-radius:6px;padding:11px 14px;margin:7px 0;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--accent)}
  .btn small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px;font-family:'Courier New',monospace}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center}
  .btn.primary small{color:#d6eadf}
  .btn.danger{border-color:var(--warn)}
  .btn.special{border:2px solid var(--gold);background:#fff8e2}
  .section-title{font-family:'Courier New',monospace;text-transform:uppercase;font-size:.75rem;letter-spacing:.12em;color:var(--muted);margin:14px 0 4px}
  .hud{background:var(--screen);color:var(--glow);border-radius:6px 6px 0 0;padding:8px 10px;font-family:'Courier New',monospace}
  .hud .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .clock{font-size:1.45rem;font-weight:bold;letter-spacing:.05em}
  .loopno{font-size:.72rem;opacity:.8;text-align:right}
  .meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
  .meter label{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;display:flex;justify-content:space-between}
  .bar{height:7px;background:#0e1510;border-radius:4px;overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;background:var(--glow);transition:width .4s}
  .bar.low i{background:#e98a6a}
  .canvasWrap{position:relative;background:#222;line-height:0}
  canvas{display:block;width:100%;touch-action:none}
  .toast{position:absolute;left:8px;right:8px;top:8px;background:rgba(31,42,34,.92);color:var(--glow);font-family:'Courier New',monospace;font-size:.85rem;line-height:1.35;padding:8px 10px;border-radius:5px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}
  .toast.bad{color:#ffb39c}
  .prompt{background:var(--screen);color:#fff;font-family:'Courier New',monospace;font-size:.85rem;padding:6px 10px;min-height:30px;border-radius:0 0 6px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .prompt b{color:var(--gold)}
  .msg{font-size:.9rem;line-height:1.4;min-height:2.8em;margin:8px 2px;color:var(--ink)}
  .controls{display:flex;justify-content:space-between;align-items:center;margin-top:6px;user-select:none;-webkit-user-select:none;touch-action:none}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
  .dpad button,.actbtn,.smallbtn{font:inherit;border:1px solid var(--line);background:#fffdf4;border-radius:10px;color:var(--ink);touch-action:none}
  .dpad button{font-size:1.4rem}
  .dpad button.on{background:#e5dfc9}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .actbtn{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;font-weight:bold;font-size:1.1rem;font-family:'Courier New',monospace;border:none;box-shadow:0 3px 0 #1d3b33}
  .actbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d3b33}
  .smallbtn{padding:6px 10px;font-size:.85rem}
  .keys{font-size:.72rem;color:var(--muted);text-align:center;font-family:'Courier New',monospace;margin-top:8px}
  .modal{position:fixed;inset:0;background:rgba(20,20,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:10px}
  .modal .card{max-width:620px;width:100%;max-height:85vh;overflow:auto;margin:0;border-top:5px solid var(--warn)}
  .modal .card.memo{border-top-color:var(--accent)}
  .modal h2{margin:.1em 0 .4em;font-size:1.15rem}
  .stamp{display:inline-block;font-family:'Courier New',monospace;font-size:.72rem;border:1px solid var(--muted);padding:1px 6px;border-radius:3px;color:var(--muted);margin-bottom:6px}
  .journal li{margin:.5em 0;line-height:1.4}
  .journal .t{font-family:'Courier New',monospace;color:var(--accent);font-size:.85rem}
  .pill{display:inline-block;font-family:'Courier New',monospace;font-size:.75rem;padding:2px 8px;border-radius:10px;background:#e5dfc9;margin:2px 4px 2px 0}
  .pill.got{background:var(--gold);color:#fff}
  .foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:20px;font-family:'Courier New',monospace}
  .sector{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sector .btn{text-align:center;padding:16px 10px}
  .sector .btn b{display:block;font-size:1.1rem}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="screen"></div>
  <div id="game" class="hidden">
    <div class="hud">
      <div class="row"><div class="clock" id="clock">8:00 AM</div><div class="loopno" id="loopno"></div></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="canvasWrap"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
    <div class="prompt"><span id="prompt">Walk up to something and press ACT.</span><span style="opacity:.7;font-size:.75rem">Review 5:00 · Out 100 · Std 40</span></div>
    <div class="msg" id="msg"></div>
    <div class="controls">
      <div class="dpad">
        <span></span><button data-d="up">▲</button><span></span>
        <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
        <span></span><button data-d="down">▼</button><span></span>
      </div>
      <div class="side">
        <button class="actbtn" id="act">ACT</button>
        <div style="display:flex;gap:6px"><button class="smallbtn" id="jbtn">📓 Journal</button><button class="smallbtn" id="mbtn">🔊</button><button class="smallbtn" id="pbtn">⏸</button></div>
      </div>
    </div>
    <div class="keys">Keyboard: arrows / WASD to move · E or Space to act · J journal · P pause · M mute</div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   OFFICE DISGRACE  v0.2  (top-down)
   A roguelite work simulator. Same Monday, every Monday.
   ============================================================ */

// ---------- Sector flavor ----------
const SECTORS = {
  public: {
    label:"Public Sector",
    blurb:"City of Bramblewood. Pension, fluorescent lights, and forms about forms.",
    org:"City of Bramblewood", title:"Plans Examiner II",
    bossShort:"Pruitt",
    work:"Review permit applications", workDone:"You review a stack of permit applications. Half are missing a signature on page 4.",
    report:"Quarterly Performance Measures report",
    memo:"the revised Form 7-B routing slip", sheet:"routing slip",
    memoText:"Pruitt leans over your cubicle wall with a mug that says WORLD'S OKAYEST SUPERVISOR. \"Hey there. So, all permit reviews now go out with the revised Form 7-B routing slip. Did you not see the memo? I'll make sure you get another copy.\"",
    consultants:"two efficiency consultants hired by the City Manager's office",
    coworker:"Dee from Zoning",
    visitor:"Mrs. Okafor",
    visitorIntro:"Mrs. Okafor is at the front counter. Her fence permit has been stuck for three months, and she took a half day off work to sort it out. Everyone else has already sent her to another floor.",
    visitorFix:"the original 1987 plat survey",
    visitorWin:"With the 1987 survey in hand, the problem takes eleven minutes to fix. Mrs. Okafor shakes your hand with both of hers. \"Nobody in this building has ever actually helped me.\"",
    review:"annual performance evaluation",
    meeting:"mandatory all-staff budget briefing",
    printer:"the shared copier", printerShort:"copier",
    cakeFor:"someone in Fleet Services you have never met",
    extinguisher:"You sign up as floor fire warden. It comes with a vest.",
    satText:"Pruitt appears, mug first. \"So. Council wants the measures report re-run before Monday. We'll be needing you in this Saturday. Mmkay? Super.\"",
    wake:"6:47 AM. The clock radio clicks on. Same traffic report. Same pothole on Elm Street.",
    decks:"You set your badge on the keyboard and walk out into the sunlight. By Friday, you're on a landscaping crew that maintains the city's medians. You've never been happier. You don't even mind the heat.",
  },
  private: {
    label:"Private Sector",
    blurb:"Veltrix Solutions. Synergy, stock options that will never vest, and reports nobody reads.",
    org:"Veltrix Solutions", title:"Reporting Analyst II",
    bossShort:"Fennimore",
    work:"Grind through QRS reports", workDone:"You grind through QRS reports. Each one is the same as the last one, with a different date.",
    report:"Quarterly Synergy Report",
    memo:"the new QRS cover sheet", sheet:"cover sheet",
    memoText:"Fennimore drifts up to your cubicle holding a mug that says SYNERGY. \"Hey there. So, all QRS reports go out with the new cover sheet now. Did you not get the memo? I'll make sure you get another copy.\"",
    consultants:"two consultants from Thorne & Pike, brought in to \"right-size\" the department",
    coworker:"Dee from Accounts Payable",
    visitor:"Priya the intern",
    visitorIntro:"Priya, the new intern, is waiting by the front desk, quietly panicking. The client deck is due at 3:00 and the source data has vanished from the shared drive.",
    visitorFix:"the archived 2019 client file",
    visitorWin:"With the 2019 file in hand, the deck comes together in twenty minutes. Priya looks at you like you just pulled her out of a river. \"Nobody here has ever actually helped me.\"",
    review:"quarterly performance review",
    meeting:"mandatory all-hands on the Five Synergy Pillars",
    printer:"the cursed printer", printerShort:"printer",
    cakeFor:"someone in Marketing you have never met",
    extinguisher:"You sign up as floor safety captain. It comes with a lanyard.",
    satText:"Fennimore appears, mug first. \"So. The client moved up the Synergy deadline. We'll be needing you in this Saturday. Mmkay? Super.\"",
    wake:"6:47 AM. The alarm goes off. The same morning DJ makes the same joke about Mondays.",
    decks:"You set your badge on the keyboard and walk out into the sunlight. By Friday, you're working for a guy named Lou who builds backyard decks. You've never been happier. You don't even miss the stock options.",
  }
};

const COVER_TALK = [
  s=>`"Hey, hey, hold on there. Quick question about the ${s.sheet}. You're using the new one, right? The one with the box in the upper left? Because the old one had the box in the upper right..."`,
  s=>`"There you are. So I was looking at the ${s.sheet} thing again, and I want to walk you through the three different shades of the header. It matters more than you think..."`,
  s=>`"Hey there. Not to be a stickler, but let's talk ${s.sheet}s. Did you know there's a version history? Let me take you through it, starting in 2014..."`,
  s=>`"Mmkay, so, real quick, ${s.sheet}s. Staple goes top left, at a forty-five degree angle. Let me show you on this one. Actually, let's do a few..."`,
  s=>`"Oh good, I've been looking for you. I made a little slideshow about the ${s.sheet}. It's only eleven slides. Walk with me..."`,
];

// ---------- Knowledge ----------
const KNOW = {
  boss:      {t:"All day", txt:s=>`${s.bossShort} patrols the halls. If you're anywhere but your cubicle and you walk into his line of sight, he talks at you about ${s.sheet}s and walks you back to your desk. Watch his cone.`},
  memo:      {t:"8:45", txt:s=>`${s.bossShort} comes by about ${s.memo}. Attach it at your desk before he gets there.`},
  printer:   {t:"10:00-11:00", txt:s=>`${cap(s.printer)} jams if you print between 10 and 11. Every time.`},
  consult:   {t:"11:00-11:20", txt:s=>`The consultants wait in the conference room for 20 minutes. Miss them and it counts against you. They seem to respect people who have stopped pretending and are at peace with it.`},
  cake:      {t:"12:00-12:30", txt:s=>`Birthday cake in the break room for ${s.cakeFor}. It's gone by 12:30.`},
  gerald:    {t:"12:00", txt:s=>`Gerald from Records sits in the corner at every cake. Nobody has ever saved him a slice.`},
  bat:       {t:"Any time", txt:s=>`Gerald still has his softball bat from the 1994 company league. "In case of emergencies."`},
  visitor:   {t:"1:30-3:15", txt:s=>`${s.visitor} is at the front counter. The fix is ${s.visitorFix}, somewhere in Records.`},
  fire:      {t:"2:00", txt:s=>`Someone burns popcorn during the ${s.meeting} and the fire alarm goes off. The fire warden sign-up sheet is on the bulletin board outside the break room.`},
  saturday:  {t:"4:30", txt:s=>`${s.bossShort} hunts you down to ask about Saturday. He never checks the stairwell.`},
  review:    {t:"5:00", txt:s=>`Passing the review takes Output 100 and Standing 40. Passing alone doesn't end the loop.`},
  dee:       {t:"Any time", txt:s=>`${s.coworker} has detailed fantasies about what she'd do to ${s.printer}. Get to know her and she'd help.`},
  quit:      {t:"Any time", txt:s=>`Storming out just resets the day. The version of you who leaves for good is at peace (Sanity 85+), has done an honest day's work first (Output 60+), packs the family photo from the desk, says goodbye to Dee, and gets out the front door without ${s.bossShort} seeing the box.`},
};

const ENDINGS = {
  promotion:{name:"Management Material", hint:"Impress the consultants."},
  field:    {name:"The Field", hint:"Some machines need to be dealt with."},
  goodday:  {name:"The Good Monday", hint:"Spend the day on other people."},
  decks:    {name:"Walked Out Into the Sun", hint:"Leave, on your own terms."},
};

const HABITS = {
  work:  {need:6, name:"Muscle Memory", desc:"Work takes 40 minutes instead of 50."},
  coffee:{need:5, name:"Bean Whisperer", desc:"Coffee restores more Sanity."},
  chat:  {need:5, name:"Hallway Diplomat", desc:"Chatting earns more Standing."},
  zone:  {need:4, name:"Thousand-Yard Stare", desc:"Zoning out restores more Sanity."},
  sneak: {need:40, name:"Cubicle Ninja", desc:"You walk faster. Built by walking around."},
};

const START=8*60, END=17*60, MIN_PER_SEC=1/0.7;
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmt = m => { m=Math.floor(m); let h=Math.floor(m/60), mm=m%60, ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(mm).padStart(2,'0')} ${ap}`; };
const clamp = v => Math.max(0,Math.min(100,v));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Persistence ----------
const SAVE_KEY='officeDisgrace_v2';
let meta = load() || freshMeta();
function freshMeta(){ return {loops:0, know:{}, habits:{work:0,coffee:0,chat:0,zone:0,sneak:0}, endings:{}, sector:null}; }
function load(){ try{ const m=JSON.parse(localStorage.getItem(SAVE_KEY)); if(m&&m.habits&&m.habits.sneak==null) m.habits.sneak=0; return m; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); }catch(e){} }
function hasHabit(k){ return meta.habits[k] >= HABITS[k].need; }

// ============================================================
//  MAP
// ============================================================
const W=36, H=24;
// 0 floor, 1 wall, 2 partition, 3 counter, 4 front door
const grid = Array.from({length:H},()=>Array(W).fill(0));
function wallRect(x0,y0,x1,y1){ for(let x=x0;x<=x1;x++){grid[y0][x]=1;grid[y1][x]=1;} for(let y=y0;y<=y1;y++){grid[y][x0]=1;grid[y][x1]=1;} }
function setT(x,y,v){ grid[y][x]=v; }
(function buildMap(){
  wallRect(0,0,W-1,H-1);
  wallRect(0,0,8,6);  setT(4,6,0);                 // boss office
  wallRect(8,0,19,6); setT(13,6,0); setT(14,6,0);  // conference
  wallRect(19,0,27,6); setT(23,6,0);               // break room
  wallRect(27,0,35,6); setT(31,6,0);               // copy room
  wallRect(27,12,35,23); setT(27,16,0); setT(27,17,0); // records
  wallRect(0,18,5,23); setT(3,18,0);               // stairwell
  wallRect(8,19,24,23); for(let x=9;x<=21;x++) setT(x,19,3); setT(23,19,0); // lobby + counter
  setT(16,23,4);                                   // front door
  for(const cy of [8,13]) for(const cx of [2,6,10,14,18,22]){
    for(let x=cx;x<=cx+2;x++) setT(x,cy,2);
    for(let y=cy+1;y<=cy+2;y++){ setT(cx,y,2); setT(cx+2,y,2); }
  }
})();
const blocking = (x,y)=>{ if(x<0||y<0||x>=W||y>=H) return true; return grid[y][x]>=1; };
const inR = (p,x0,y0,x1,y1)=> p.x>=x0 && p.x<x1+1 && p.y>=y0 && p.y<y1+1;
const REG = {
  cube:[11,9,11,11], boss:[1,1,7,5], conf:[9,1,18,5], brk:[20,1,26,5], copy:[28,1,34,5],
  rec:[28,13,34,22], stair:[1,19,4,22], lobby:[9,20,23,22],
};
function regionName(p){
  if(inR(p,...REG.cube)) return 'Your cubicle';
  if(inR(p,...REG.boss)) return `${S.bossShort}'s office`;
  if(inR(p,...REG.conf)) return 'Conference room';
  if(inR(p,...REG.brk)) return 'Break room';
  if(inR(p,...REG.copy)) return 'Copy room';
  if(inR(p,...REG.rec)) return 'Records';
  if(inR(p,...REG.stair)) return 'Stairwell';
  if(inR(p,...REG.lobby)) return 'Lobby';
  return 'Hallway';
}

// ============================================================
//  AUDIO  (all synthesized; no audio files)
// ============================================================
const AudioSys = (()=>{
  let ac=null, an=null, master, musicG, ambG, sfxG, noiseBuf, brownBuf;
  let pendingBattle=false, mode='none', step=0, nextT=0, timer=null, cycle=0, ambOn=false, ambNodes=[], ambTimers=[];
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    try{
      if(!ac){
        ac=new (window.AudioContext||window.webkitAudioContext)();
        master=ac.createGain(); master.connect(ac.destination); an=ac.createAnalyser(); an.fftSize=2048; master.connect(an);
        musicG=ac.createGain(); musicG.gain.value=0.6; musicG.connect(master);
        ambG=ac.createGain(); ambG.gain.value=0.75; ambG.connect(master);
        sfxG=ac.createGain(); sfxG.gain.value=0.9; sfxG.connect(master);
        noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
        brownBuf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate); const b=brownBuf.getChannelData(0); let l=0; for(let i=0;i<b.length;i++){ l=(l+0.02*(Math.random()*2-1))/1.02; b[i]=l*3.5; }
        timer=setInterval(sched,40);
        document.addEventListener('visibilitychange',()=>{ if(!ac) return; document.hidden?ac.suspend():ac.resume(); });
      }
      ac.resume(); applyMute();
    }catch(e){ ac=null; }
  }
  function applyMute(){ if(master) master.gain.setTargetAtTime(meta.muted?0:1.5, ac.currentTime, 0.05); }
  function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
  function osc(type,freq,t,dur,peak,dest,a=0.005,detune=0){
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=freq; o.detune.value=detune;
    o.connect(g); g.connect(dest); env(g,t,a,peak,dur); o.start(t); o.stop(t+a+dur+0.05); return o;
  }
  function noise(t,dur,peak,dest,ftype,ffreq,q=1,pan=0){
    const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ac.createBiquadFilter(); f.type=ftype; f.frequency.value=ffreq; f.Q.value=q;
    const g=ac.createGain(); s.connect(f); f.connect(g);
    let out=g; if(pan && ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=pan; g.connect(p); out=p; }
    out.connect(dest); env(g,t,0.002,peak,dur); s.start(t, Math.random()*1.5); s.stop(t+dur+0.05);
  }
  // ---- instruments
  const ep=(m,t,d,v=0.09)=>{ osc('sine',mtof(m),t,d,v,musicG,0.01); osc('sine',mtof(m)*2,t,d*0.5,v*0.18,musicG,0.005); };
  const vibe=(m,t,d)=>{ const o=osc('sine',mtof(m),t,d+0.6,0.11,musicG,0.004); const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=5.5; lg.gain.value=3; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+d+0.7); osc('sine',mtof(m)*4,t,0.15,0.02,musicG); };
  const bass=(m,t,d)=>{ const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(); o.type='triangle'; o.frequency.value=mtof(m); f.type='lowpass'; f.frequency.value=500; o.connect(f); f.connect(g); g.connect(musicG); env(g,t,0.01,0.22,d); o.start(t); o.stop(t+d+0.1); };
  const shaker=(t,v)=>noise(t,0.05,v,musicG,'highpass',6500);
  const sq=(m,t,d,v=0.05,dest=musicG)=>{ const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(); o.type='square'; o.frequency.value=mtof(m); f.type='lowpass'; f.frequency.value=2600; o.connect(f); f.connect(g); g.connect(dest); env(g,t,0.004,v,d); o.start(t); o.stop(t+d+0.05); };
  const kick=t=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); o.connect(g); g.connect(musicG); env(g,t,0.002,0.45,0.16); o.start(t); o.stop(t+0.2); };
  const snare=t=>{ noise(t,0.12,0.18,musicG,'bandpass',1800,0.8); osc('triangle',190,t,0.07,0.08,musicG); };

  // ---- elevator bossa (original). 8 bars, 16 steps each.
  const PROG=[ {r:36,c:[64,67,71,72]}, {r:33,c:[60,64,67,69]}, {r:38,c:[62,65,69,72]}, {r:31,c:[59,62,65,67]},
               {r:40,c:[62,64,67,71]}, {r:33,c:[61,64,67,69]}, {r:38,c:[60,65,69,72]}, {r:31,c:[59,62,65,69]} ];
  const MEL=[ [[0,76,6],[6,74,2],[8,72,4],[12,71,4]], [[0,72,6],[6,69,2],[8,67,8]], [[0,69,4],[4,72,4],[8,77,6],[14,76,2]], [[0,74,8],[8,71,4],[12,67,4]],
              [[0,71,6],[6,74,2],[8,79,4],[12,78,4]], [[0,76,6],[6,73,2],[8,69,8]], [[0,72,4],[4,74,4],[8,77,4],[12,76,4]], [[0,74,12]] ];
  function elevatorStep(s,t,spb16){
    const bar=Math.floor(s/16)%8, st=s%16, ch=PROG[bar];
    if(st===0 && bar===0 && s>0) cycle++;
    if([0,6,10,13].includes(st)) ch.c.forEach(m=>ep(m,t,st===0?spb16*5:spb16*2.2,0.05));
    if(st===0) bass(ch.r,t,spb16*5); if(st===6||st===8) bass(ch.r+7,t,spb16*1.8); if(st===14) bass(ch.r,t,spb16*1.8);
    shaker(t,[0.035,0.012,0.02,0.012][st%4]);
    if(cycle%2===0) for(const [ss,m,d] of MEL[bar]) if(ss===st) vibe(m,t,spb16*d);
  }
  // ---- battle loop (original): chromatic tension in E minor
  const BROOT=[40,41,40,43];
  function battleStep(s,t,spb16){
    const bar=Math.floor(s/16)%4, st=s%16, r=BROOT[bar];
    sq(r+([2,5,7,10,13].includes(st)?12:0),t,spb16*0.8,0.06);
    if(st%2===0){ const arp=[24,27,31,36,31,27,24,27]; sq(r+arp[st/2],t,spb16*1.6,0.035); }
    if(st===0||st===8||(st===10&&bar===3)) kick(t);
    if(st===4||st===12) snare(t);
    noise(t,0.03,st%2?0.02:0.04,musicG,'highpass',8000);
    if(bar===3 && st>=12) sq(r+36+(st-12),t,spb16*0.9,0.03);
  }
  function sched(){
    if(!ac || mode==='none') return;
    const bpm = mode==='battle'?168:96, spb16=60/bpm/4;
    if(nextT<ac.currentTime) nextT=ac.currentTime+0.05;
    while(nextT < ac.currentTime+0.18){
      (mode==='battle'?battleStep:elevatorStep)(step,nextT,spb16);
      nextT+=spb16 * (mode==='elevator' && step%2 ? 0.92 : (mode==='elevator'?1.08:1)); // light swing
      step++;
    }
  }
  function setMode(m, delay=0.05){ if(!ac) return; pendingBattle=false; if(m===mode) return; mode=m; step=0; cycle=0; nextT=ac.currentTime+delay; }

  // ---- ambience
  function ambience(on){
    if(!ac || on===ambOn) return; ambOn=on;
    if(!on){ ambNodes.forEach(n=>{try{n.stop()}catch(e){}}); ambNodes=[]; ambTimers.forEach(clearTimeout); ambTimers=[]; return; }
    // HVAC rumble
    const s=ac.createBufferSource(); s.buffer=brownBuf; s.loop=true; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; const g=ac.createGain(); g.gain.value=0.28;
    s.connect(f); f.connect(g); g.connect(ambG); s.start(); ambNodes.push(s);
    // fluorescent hum
    for(const [fr,v] of [[120,0.012],[240,0.005]]){ const o=ac.createOscillator(), og=ac.createGain(); o.frequency.value=fr; og.gain.value=v; o.connect(og); og.connect(ambG); o.start(); ambNodes.push(o); }
    const later=(fn,min,max)=>{ const id=setTimeout(()=>{ if(!ambOn) return; fn(); later(fn,min,max); }, (min+Math.random()*(max-min))*1000); ambTimers.push(id); };
    // keyboard clatter from nearby cubicles
    later(()=>{ const pan=Math.random()*1.6-0.8, n=6+Math.floor(Math.random()*16); let t=ac.currentTime+0.05;
      for(let i=0;i<n;i++){ noise(t,0.018,0.05+Math.random()*0.04,ambG,'bandpass',2200+Math.random()*1800,2.5,pan); t+=0.07+Math.random()*0.12; if(Math.random()<0.08) t+=0.4; } }, 1.5, 5);
    // mouse clicks
    later(()=>{ const t=ac.currentTime+0.02; noise(t,0.01,0.05,ambG,'bandpass',3500,4,Math.random()-0.5); noise(t+0.12,0.01,0.04,ambG,'bandpass',3300,4); }, 3, 9);
    // distant desk phone
    later(()=>{ let t=ac.currentTime+0.05; for(let r=0;r<2;r++){ for(let k=0;k<12;k++){ osc('sine',440,t+k*0.05,0.04,0.012,ambG); osc('sine',480,t+k*0.05,0.04,0.012,ambG); } t+=1.4; } }, 22, 55);
    // copier churning
    later(()=>{ const t=ac.currentTime+0.05; for(let k=0;k<10;k++) noise(t+k*0.32,0.22,0.035,ambG,'bandpass',700,1.2,0.6); }, 28, 70);
    // throat clear / chair squeak
    later(()=>{ const t=ac.currentTime; const o=ac.createOscillator(), og=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(900,t); o.frequency.linearRampToValueAtTime(1300,t+0.18); const lp=ac.createBiquadFilter(); lp.type='bandpass'; lp.frequency.value=1100; o.connect(lp); lp.connect(og); og.connect(ambG); env(og,t,0.03,0.012,0.18); o.start(t); o.stop(t+0.3); }, 15, 40);
  }

  // ---- sfx
  function sfx(k){
    if(!ac) return; const t=ac.currentTime+0.01;
    if(k==='blip'){ osc('sine',880,t,0.06,0.08,sfxG); osc('sine',1320,t+0.05,0.07,0.06,sfxG); }
    if(k==='ding'){ osc('sine',1046,t,0.6,0.08,sfxG); osc('sine',1318,t+0.12,0.7,0.06,sfxG); }
    if(k==='learn'){ [72,76,79,84].forEach((m,i)=>osc('triangle',mtof(m),t+i*0.07,0.25,0.06,sfxG)); }
    if(k==='fanfare'){ [[60,0],[64,.12],[67,.24],[72,.36],[67,.6],[72,.72]].forEach(([m,d])=>{ sq(m,t+d,0.2,0.06,sfxG); sq(m-12,t+d,0.2,0.04,sfxG); }); [60,64,67,72].forEach(m=>osc('triangle',mtof(m),t+0.9,1.2,0.05,sfxG)); }
    if(k==='wahwah'){ [[62,0,.35],[61,.42,.35],[60,.84,.35],[59,1.26,1.1]].forEach(([m,d,l])=>{ const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(); o.type='sawtooth'; o.frequency.value=mtof(m-12); f.type='lowpass'; f.frequency.setValueAtTime(400,t+d); f.frequency.linearRampToValueAtTime(1200,t+d+l*0.5); f.frequency.linearRampToValueAtTime(350,t+d+l); o.connect(f); f.connect(g); g.connect(sfxG); env(g,t+d,0.04,0.12,l); o.start(t+d); o.stop(t+d+l+0.1); }); }
  }
  // the "you've been spotted" encounter sting, then battle music
  function spotted(){
    if(!ac) return; const t=ac.currentTime+0.01;
    osc('square',1760,t,0.05,0.07,sfxG); osc('square',2093,t+0.06,0.09,0.07,sfxG);
    [[64,67,71],[65,68,72],[66,69,73],[67,70,74]].forEach((ch,i)=>ch.forEach(m=>sq(m,t+0.16+i*0.085,0.08,0.05,sfxG)));
    const tt=t+0.52;
    [52,58,64,70].forEach(m=>{ const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(); o.type='sawtooth'; o.frequency.value=mtof(m); f.type='lowpass'; f.frequency.setValueAtTime(3000,tt); f.frequency.exponentialRampToValueAtTime(300,tt+0.7); o.connect(f); f.connect(g); g.connect(sfxG); env(g,tt,0.01,0.05,0.7); o.start(tt); o.stop(tt+0.8); });
    noise(tt,0.5,0.08,sfxG,'bandpass',1200,0.7);
    setMode('none'); pendingBattle=true; setTimeout(()=>{ if(pendingBattle) setMode('battle',0.02); },900);
  }
  function peak(){ if(!an) return -1; const d=new Float32Array(an.fftSize); an.getFloatTimeDomainData(d); let m=0; for(const v of d) m=Math.max(m,Math.abs(v)); return m; }
  return {init, setMode, ambience, sfx, spotted, applyMute, peak, get mode(){return mode;}, get on(){return !!ac;}};
})();

function delta(o){ const p=[]; if(o.out) p.push(`Output ${o.out>0?'+':''}${o.out}`); if(o.std) p.push(`Standing ${o.std>0?'+':''}${o.std}`); if(o.san) p.push(`Sanity ${o.san>0?'+':''}${o.san}`); return p.length?` [${p.join(', ')}]`:''; }

// ---------- Event flow ----------
function presentModal(){
  if(!modal) return;
  const m=modal;
  showModal(`<span class="stamp">${fmt(run.t)}</span><h2>${esc(m.title)}</h2><p>${esc(m.text)}</p>
    ${m.choices.map((c,i)=>`<button class="btn ${c.special?'special':''}" data-i="${i}">${esc(c.label)}</button>`).join('')}`, '', i=>{
      closeModal(); modal=null; m.choices[+i].fx(); save(); afterChange();
    });
}
function afterChange(){
  renderHud();
  if(run.done) return;
  if(run.san<=0) return endLoop(`Something snaps. You find yourself standing on your desk, explaining the concept of time to the copy room. Security is very gentle about it.`, 'Sanity hit zero.');
  if(run.std<=0) return endLoop(`HR calls you in. There's a box on the table with your stuff already in it.`, 'Standing hit zero. You were let go.');
  if(modal) presentModal();
}
function checkTriggers(){
  const r=run, f=r.f;
  for(const e of scheduled()){
    if(!r.fired[e.id] && r.t>=e.time){ r.fired[e.id]=true; const m=e.ev(); if(m){ modal=m; AudioSys.sfx('ding'); presentModal(); return true; } }
  }
  if(!f.consultDone && r.t>=11*60 && r.t<11*60+20 && inR(player,...REG.conf)){ modal=consultEvent(); AudioSys.sfx('ding'); presentModal(); return true; }
  if(!f.cakeDone && r.t>=12*60 && r.t<12*60+30 && inR(player,...REG.brk)){ modal=cakeEvent(); AudioSys.sfx('ding'); presentModal(); return true; }
  if(r.t>=END){ review(); return true; }
  return false;
}

// ---------- Review & endings ----------
function review(){
  learn('review');
  const r=run, f=r.f;
  if(f.promo) return ending('promotion');
  if(f.helped && f.geraldFriend && r.out>=100 && r.std>=40) return ending('goodday');
  if(r.out>=100 && r.std>=40) return endLoop(`Your ${S.review} goes fine. "Meets expectations." ${S.bossShort} gives you a thumbs-up without looking up from his phone. You drive home, eat dinner, and go to bed early.`, `You passed. It didn't matter.`);
  endLoop(`Your ${S.review} lasts four minutes. ${S.bossShort} reads "needs improvement" directly off the form, twice.`, r.out<100?`Output was ${r.out}/100.`:`Standing was ${r.std}/40.`);
}
function endLoop(text, reason){ run.done={type:'loop',text,reason}; save(); AudioSys.setMode('none'); AudioSys.ambience(false); AudioSys.sfx('wahwah'); doneScreen(); }
function ending(k){
  const fresh=!meta.endings[k]; meta.endings[k]=meta.loops; save();
  const txt={
    promotion:`On Tuesday (it's Tuesday!) the consultants' report comes out. It recommends cutting half the department and promoting you, because you are "clearly management material." Your new office has a window. You still don't do much. Nobody notices.`,
    field:`You, Dee, and Gerald carry ${S.printer} out the front door and across the street to an empty lot. Gerald hands you the bat. Somebody has a song playing on their phone. Nobody says a word. It takes a long time, and it is beautiful. When you wake up the next morning, the radio says it's Tuesday.`,
    goodday:`You didn't game the day this time. You spent it on other people: a slice of cake for Gerald, an afternoon for ${S.visitor}, and the work done well because it was worth doing well. ${S.bossShort} says "meets expectations." It does. When you wake up the next morning, the radio says it's Tuesday.`,
    decks:S.decks+` When you wake up the next morning, the radio says it's Tuesday.`,
  }[k];
  run.done={type:'ending',k,text:txt,fresh}; AudioSys.setMode('none'); AudioSys.ambience(false); AudioSys.sfx('fanfare'); doneScreen();
}

// ============================================================
//  UPDATE LOOP
// ============================================================
const keys={};
function isPaused(){ return !run || run.done || modal || menuOpen || paused || journalOpen; }
let stepAcc=0;
function update(dt){
  const r=run;
  let dx=0, dy=0;
  if(keys.left) dx-=1; if(keys.right) dx+=1; if(keys.up) dy-=1; if(keys.down) dy+=1;
  if(dx||dy){
    const l=Math.hypot(dx,dy); dx/=l; dy/=l;
    let sp = player.carry==='printer'?2.0:(hasHabit('sneak')?4.6:3.8);
    if(player.carry==='box') sp*=0.9;
    moveP(dx*sp*dt, 0); moveP(0, dy*sp*dt);
    stepAcc+=dt; if(stepAcc>3){ stepAcc=0; meta.habits.sneak++; }
  }
  r.t += dt*MIN_PER_SEC;
  updateBoss(dt);
  if(modal) return;
  if(checkTriggers()) return;
  const o=nearest();
  document.getElementById('prompt').innerHTML = o ? `ACT: <b>${esc(o.name)}</b>` : `<span style="opacity:.7">${esc(regionName(player))}${player.carry?` · carrying ${player.carry==='box'?'a box':S.printerShort}`:''}</span>`;
  renderHud();
}
function moveP(dx,dy){
  const rad=0.3, nx=player.x+dx, ny=player.y+dy;
  const pts=[[nx-rad,ny-rad],[nx+rad,ny-rad],[nx-rad,ny+rad],[nx+rad,ny+rad]];
  if(pts.some(([x,y])=>blocking(Math.floor(x),Math.floor(y)))) return;
  player.x=nx; player.y=ny;
}
function angDiff(a,b){ let d=a-b; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return d; }
function los(x0,y0,x1,y1){
  const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*5);
  for(let i=1;i<n;i++){ const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n; if(grid[Math.floor(y)][Math.floor(x)]===1) return false; }
  return true;
}
function bossSees(px,py){
  const dx=px-boss.x, dy=py-boss.y, d=Math.hypot(dx,dy);
  if(d>VIEW_R) return false;
  if(d>0.7 && Math.abs(angDiff(Math.atan2(dy,dx),boss.ang))>VIEW_HALF) return false;
  return los(boss.x,boss.y,px,py);
}
function playerExposed(){
  const t=run.t, f=run.f;
  if(player.carry) return true;
  if(inR(player,...REG.cube)) return false;
  if(t<f.graceUntil) return false;
  if(t>=11*60 && t<11*60+20 && inR(player,...REG.conf)) return false;
  return true;
}
function updateBoss(dt){
  if(boss.chase){
    const dx=player.x-boss.x, dy=player.y-boss.y, d=Math.hypot(dx,dy);
    boss.ang=Math.atan2(dy,dx);
    boss.alert-=dt;
    if(boss.alert<=0 && d>1.0){ boss.x+=dx/d*4.5*dt; boss.y+=dy/d*4.5*dt; }
    if(boss.alert<=0 && (d<=1.0 || boss.alert<-2.5)){ boss.chase=false; modal=spottedEvent(); presentModal(); }
    return;
  }
  const [tx,ty,pause]=BOSS_PATH[boss.wp];
  const dx=tx-boss.x, dy=ty-boss.y, d=Math.hypot(dx,dy);
  if(boss.wait>0){
    boss.wait-=dt; boss.look+=dt;
    boss.ang = boss.baseAng + Math.sin(boss.look*1.8)*1.2;   // castle-guard head turn
    if(boss.wait<=0) boss.wp=(boss.wp+1)%BOSS_PATH.length;
  } else if(d<0.08){
    boss.x=tx; boss.y=ty; boss.wait=pause; boss.look=0; boss.baseAng=boss.ang;
    if(!pause) boss.wp=(boss.wp+1)%BOSS_PATH.length;
  } else {
    const want=Math.atan2(dy,dx);
    boss.ang += angDiff(want,boss.ang)*Math.min(1,dt*8);
    const sp=2.3*dt; boss.x+=dx/d*Math.min(sp,d); boss.y+=dy/d*Math.min(sp,d);
  }
  if(playerExposed() && bossSees(player.x,player.y)){
    boss.chase=true; boss.alert=0.7; AudioSys.spotted(); toast(`❗ ${S.bossShort} spotted you!`, true);
  }
}

//  RENDER
// ============================================================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let TS=32, VW=0, VH=0, DPR=1;
function sizeCanvas(){
  const w=cv.parentElement.clientWidth || 360;
  const h=Math.round(Math.min(w*0.82, window.innerHeight*0.5));
  DPR=window.devicePixelRatio||1;
  cv.width=w*DPR; cv.height=h*DPR; cv.style.height=h+'px';
  VW=w; VH=h; TS=Math.max(26, Math.min(40, Math.floor(w/13)));
}
window.addEventListener('resize', ()=>{ if(run) sizeCanvas(); });

function floorColor(x,y){
  const p={x:x+.5,y:y+.5};
  if(inR(p,...REG.boss)) return (x+y)%2?'#8a6a4a':'#86664a';
  if(inR(p,...REG.conf)) return (x+y)%2?'#6f7c88':'#6b7884';
  if(inR(p,...REG.brk)) return (x+y)%2?'#e8e4da':'#c9c4b8';
  if(inR(p,...REG.copy)) return '#b3ada0';
  if(inR(p,...REG.rec)) return (x+y)%2?'#8f8d86':'#8a8881';
  if(inR(p,...REG.stair)) return '#9a978e';
  if(inR(p,...REG.lobby)) return (x+y)%2?'#d8d2c2':'#cfc8b6';
  return (x*7+y*3)%5===0?'#a59f88':'#aaa48d';
}
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#222'; ctx.fillRect(0,0,VW,VH);
  const camX=Math.max(0,Math.min(W*TS-VW, player.x*TS-VW/2));
  const camY=Math.max(0,Math.min(H*TS-VH, player.y*TS-VH/2));
  ctx.save(); ctx.translate(-Math.round(camX),-Math.round(camY));
  const T=TS;
  const x0=Math.max(0,Math.floor(camX/T)), y0=Math.max(0,Math.floor(camY/T)), x1=Math.min(W-1,x0+Math.ceil(VW/T)+1), y1=Math.min(H-1,y0+Math.ceil(VH/T)+1);
  const emoji=(e,x,y,s=0.7)=>{ ctx.font=`${T*s}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(e,x*T,y*T); };
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const v=grid[y][x], X=x*T, Y=y*T;
    if(v===1){ ctx.fillStyle='#4a4740'; ctx.fillRect(X,Y,T,T); ctx.fillStyle='#5d594f'; ctx.fillRect(X,Y,T,T*0.25); continue; }
    ctx.fillStyle=floorColor(x,y); ctx.fillRect(X,Y,T,T);
    if(v===2){ ctx.fillStyle='#7b8794'; ctx.fillRect(X+2,Y+2,T-4,T-4); ctx.fillStyle='#93a0ad'; ctx.fillRect(X+2,Y+2,T-4,4); }
    if(v===3){ ctx.fillStyle='#7a5a3a'; ctx.fillRect(X,Y+T*0.2,T,T*0.6); ctx.fillStyle='#93704c'; ctx.fillRect(X,Y+T*0.2,T,4); }
    if(v===4){ ctx.fillStyle='#3f6d5a'; ctx.fillRect(X+2,Y,T-4,T); emoji('🚪',x+.5,y+.5,.55); }
  }
  const rect=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x*T,y*T,w*T,h*T); };
  const label=(t,x,y,c='#fff')=>{ ctx.font=`bold ${Math.max(9,T*0.3)}px 'Courier New',monospace`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.strokeText(t,x*T,y*T); ctx.fillStyle=c; ctx.fillText(t,x*T,y*T); };
  rect(2,2,4,1.2,'#5a3e28'); emoji('🖥️',3,2.5,.55);                     // boss desk
  rect(10.5,2,6,2.2,'#4b3a2c');                                           // conference table
  rect(21,2.5,3,1.4,'#c2b49a');                                           // break table
  if(run.t>=12*60 && run.t<12*60+30 && !run.f.cakeDone) emoji('🎂',22.5,3.2,.75);
  emoji('☕',25.5,1.5,.8); emoji('🖨️',31.5,1.6,.95); emoji('🥤',33.5,7.4,.8); emoji('📌',21.5,6.5,.6);
  rect(29,14,1,8,'#6d5a40'); rect(31,14,1,3,'#6d5a40'); rect(33,19,1,3,'#6d5a40');
  emoji('📦',29.5,15,.55); emoji('📦',29.5,18,.55); emoji('📦',33.5,20,.55);
  emoji('🪴',6.5,20.5,.8); emoji('🪴',25.5,21.5,.8);
  for(let i=0;i<4;i++) rect(1,19.4+i,4,.12,'#7d7a72');
  for(const cy of [8,13]) for(const cx of [2,6,10,14,18,22]){ rect(cx+1,cy+1,1,.55,'#8b6b4b'); emoji('🖥️',cx+1.5,cy+1.25,.45); }
  emoji('🖼️',11.85,9.1,.35);
  for(const [x,y,c] of [[3.5,9.7,'#7a9a6a'],[15.5,9.7,'#a37a9a'],[23.5,9.7,'#7a8aa3'],[3.5,14.7,'#a3907a'],[11.5,14.7,'#6aa39a'],[23.5,14.7,'#9a6a6a']]) person(x,y,c,'#e0bd98');
  const npc=(x,y,body,name,c)=>{ person(x,y,body,'#e9c9a6'); if(name) label(name,x,y-0.75,c); };
  npc(19.5,14.7,'#c86f4a','Dee');
  npc(33.2,17.6,'#7d7356','Gerald');
  if(run.t>=11*60 && run.t<11*60+20 && !run.f.consultDone){ npc(12,2.9,'#333','Consultants','#ffd'); npc(15,2.9,'#333',''); }
  if(visitorHere()) npc(15.5,20.6,'#5b7fb0',S.visitor.split(' ')[0],'#ffd');
  const o=nearest();
  if(o){ const pulse=0.5+0.5*Math.sin(now/180); ctx.strokeStyle=`rgba(185,138,42,${0.5+pulse*0.5})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(o.x*T,o.y*T,T*0.6,0,Math.PI*2); ctx.stroke(); }
  // boss vision cone (walls cut it off)
  ctx.beginPath(); ctx.moveTo(boss.x*T,boss.y*T);
  for(let i=0;i<=24;i++){
    const a=boss.ang-VIEW_HALF+2*VIEW_HALF*i/24;
    let d=0; while(d<VIEW_R){ d+=0.1; const x=boss.x+Math.cos(a)*d, y=boss.y+Math.sin(a)*d; if(grid[Math.floor(y)]?.[Math.floor(x)]===1) break; }
    ctx.lineTo((boss.x+Math.cos(a)*d)*T,(boss.y+Math.sin(a)*d)*T);
  }
  ctx.closePath();
  ctx.fillStyle = boss.chase?'rgba(230,70,50,.38)':'rgba(255,230,110,.30)'; ctx.fill();
  person(boss.x,boss.y,'#3c4f7a','#f0cfae',true);
  label(S.bossShort,boss.x,boss.y-0.8,'#ffe9a0');
  if(boss.chase){ ctx.font=`bold ${T*0.9}px sans-serif`; ctx.fillStyle='#e8402a'; ctx.textAlign='center'; ctx.fillText('!',boss.x*T,(boss.y-1.35)*T); }
  person(player.x,player.y,'#2f5d50','#f2d0b0',false,true);
  label('You',player.x,player.y+0.62,'#cfe8d8');
  if(player.carry==='box') emoji('📦',player.x+0.05,player.y-0.6,.55);
  if(player.carry==='printer') emoji('🖨️',player.x,player.y-0.65,.75);
  ctx.restore();
  if(Math.random()<0.004){ ctx.fillStyle='rgba(255,255,230,.08)'; ctx.fillRect(0,0,VW,VH); }
  if(boss.chase && boss.alert>0){ // battle-encounter wipe
    const p=1-boss.alert/0.7, n=10, bh=VH/n;
    if(p<0.25 && Math.floor(p*40)%2===0){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(0,0,VW,VH); }
    ctx.fillStyle='rgba(10,10,10,.9)';
    for(let i=0;i<n;i++){ const w=VW*Math.min(1,Math.max(0,(p-0.2)*1.6)); if(i%2) ctx.fillRect(0,i*bh,w,bh+1); else ctx.fillRect(VW-w,i*bh,w,bh+1); }
  }
}
function person(x,y,body,skin,isBoss,isPlayer){
  const T=TS;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x*T,(y+0.28)*T,T*0.3,T*0.12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x*T,y*T,T*0.3,0,Math.PI*2); ctx.fill();
  if(isPlayer){ ctx.fillStyle='#b8392a'; ctx.fillRect(x*T-2,y*T-T*0.05,4,T*0.28); }
  if(isBoss){ ctx.strokeStyle='#c9a227'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x*T-T*0.15,y*T-T*0.25); ctx.lineTo(x*T-T*0.15,y*T+T*0.25); ctx.moveTo(x*T+T*0.15,y*T-T*0.25); ctx.lineTo(x*T+T*0.15,y*T+T*0.25); ctx.stroke(); }
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(x*T,(y-0.22)*T,T*0.17,0,Math.PI*2); ctx.fill();
  if(isBoss){ ctx.fillStyle='#ddd'; ctx.fillRect(x*T+T*0.22,y*T-T*0.05,T*0.14,T*0.16); }
}

function renderHud(){
  if(!run) return;
  document.getElementById('clock').textContent=fmt(Math.min(run.t,END));
  document.getElementById('loopno').innerHTML=`LOOP #${meta.loops}<br>${esc(S.org)}`;
  const m=(k,v)=>`<div class="meter"><label><span>${k}</span><span>${v}</span></label><div class="bar ${v<25?'low':''}"><i style="width:${v}%"></i></div></div>`;
  document.getElementById('meters').innerHTML=m('Output',run.out)+m('Standing',run.std)+m('Sanity',run.san);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(toastT>0){ toastT-=dt; if(toastT<=0) document.getElementById('toast').className='toast'; }
  if(run && !isPaused()) update(dt);
  if(run && !run.done) draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================
//  INPUT
// ============================================================
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',e=>{
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]]=true; if(run&&!run.done) e.preventDefault(); }
  if(!run||run.done) return;
  if((e.code==='KeyE'||e.code==='Space'||e.code==='Enter') && !isPaused()){ e.preventDefault(); tryAct(); }
  if(e.code==='KeyJ') toggleJournal();
  if(e.code==='KeyP') togglePause();
  if(e.code==='KeyM') toggleMute();
});
window.addEventListener('keyup',e=>{ if(KEYMAP[e.code]) keys[KEYMAP[e.code]]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.querySelectorAll('.dpad button').forEach(b=>{
  const d=b.dataset.d;
  const on=e=>{ e.preventDefault(); keys[d]=true; b.classList.add('on'); };
  const off=()=>{ keys[d]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.getElementById('act').addEventListener('click',()=>{ if(!isPaused()) tryAct(); });
document.getElementById('jbtn').addEventListener('click',toggleJournal);
document.getElementById('pbtn').addEventListener('click',togglePause);
document.getElementById('mbtn').addEventListener('click',toggleMute);
function toggleMute(){ meta.muted=!meta.muted; save(); AudioSys.init(); AudioSys.applyMute(); document.getElementById('mbtn').textContent=meta.muted?'🔇':'🔊'; }
function tryAct(){ const o=nearest(); if(o) openMenu(o); else toast(`Nothing to do here. Walk up to something.`); }

// ============================================================
//  SCREENS & MODALS
// ============================================================
function show(which){ document.getElementById('screen').classList.toggle('hidden',which!=='screen'); document.getElementById('game').classList.toggle('hidden',which!=='game'); }
function showModal(inner, cls, onPick){
  for(const k in keys) keys[k]=false;
  document.querySelectorAll('.dpad button').forEach(b=>b.classList.remove('on'));
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal"><div class="card ${cls}">${inner}</div></div>`;
  root.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>onPick(b.dataset.i)));
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function toggleJournal(){
  if(!run||run.done) return;
  if(journalOpen){ journalOpen=false; closeModal(); return; }
  if(modal||menuOpen||paused) return;
  journalOpen=true;
  const entries=Object.keys(KNOW).filter(k=>meta.know[k]);
  const hab=Object.entries(HABITS).map(([k,v])=>`<li><b>${v.name}</b> ${hasHabit(k)?'<span class="pill got">unlocked</span>':`<span class="pill">${Math.min(meta.habits[k],v.need)}/${v.need}</span>`}<br><span style="color:var(--muted);font-size:.9rem">${v.desc}</span></li>`).join('');
  showModal(`<h2>📓 Journal</h2><p style="color:var(--muted);font-size:.9rem">The day resets. This doesn't. (Game is paused.)</p>
    ${entries.length?`<ul class="journal">${entries.map(k=>`<li><span class="t">${KNOW[k].t}</span><br>${esc(KNOW[k].txt(S))}</li>`).join('')}</ul>`:'<p><i>Nothing yet. Live the day and pay attention.</i></p>'}
    <div class="section-title">Habits (built by repetition)</div><ul class="journal">${hab}</ul>
    <button class="btn primary" data-i="x">Close</button>`,'memo',()=>{ journalOpen=false; closeModal(); });
}
function togglePause(){
  if(!run||run.done||modal||menuOpen||journalOpen) return;
  paused=true;
  showModal(`<h2>Paused</h2><p>${fmt(run.t)} · ${esc(regionName(player))}</p>
    <p style="color:var(--muted);font-size:.9rem">Tip: the yellow cone is what ${S.bossShort} can see. Walls block it. Cubicle partitions don't. You're safe inside your own cubicle.</p>
    <button class="btn primary" data-i="r">Resume</button>
    <button class="btn" data-i="t" style="text-align:center">Quit to title (this loop is lost)</button>`,'memo',i=>{
      closeModal(); paused=false; if(i==='t'){ run=null; AudioSys.setMode('none'); AudioSys.ambience(false); titleScreen(); } });
}

let wipeArmed=false;
function titleScreen(){
  run=null; modal=null; show('screen');
  const got=Object.keys(meta.endings).length;
  document.getElementById('screen').innerHTML=`
    <h1>Office Disgrace</h1>
    <p class="tag">A roguelite work simulator. It's Monday. Again.</p>
    <div class="card">
      <p>You wake up at 6:47 AM. You go to work. Your performance review is at 5:00.</p>
      <p>Then you wake up at 6:47 AM. And it's the same Monday.</p>
      <p style="color:var(--muted);font-size:.9rem">Every loop resets your day, but not what you <i>know</i>. Learn when things happen, stay out of your boss's line of sight, and find a way to reach Tuesday.</p>
    </div>
    <div class="section-title">Choose your career</div>
    <div class="sector">
      <button class="btn" data-s="public"><b>🏛️ Public Sector</b><small>${SECTORS.public.blurb}</small></button>
      <button class="btn" data-s="private"><b>🏢 Private Sector</b><small>${SECTORS.private.blurb}</small></button>
    </div>
    ${meta.loops?`<div class="section-title">Progress</div>
    <div class="card">
      <div>Loops lived: <b>${meta.loops}</b> · Journal: <b>${Object.keys(meta.know).length}/${Object.keys(KNOW).length}</b></div>
      <div style="margin-top:8px">Ways out (${got}/4):<br>${Object.entries(ENDINGS).map(([k,e])=>`<span class="pill ${meta.endings[k]?'got':''}">${meta.endings[k]?e.name:'??? · '+e.hint}</span>`).join('')}</div>
      <button class="btn danger" id="wipe" style="margin-top:12px;text-align:center">Erase all progress</button>
    </div>`:''}
    <div class="foot">v0.3 · top-down mockup with sound · progress saves in this browser</div>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ meta.sector=b.dataset.s; save(); newRun(); });
  const w=document.getElementById('wipe');
  if(w) w.onclick=()=>{ if(!wipeArmed){ wipeArmed=true; w.textContent='Tap again to confirm'; return; } meta=freshMeta(); save(); wipeArmed=false; titleScreen(); };
}

function doneScreen(){
  closeModal(); modal=null; menuOpen=false; show('screen');
  const d=run.done, el=document.getElementById('screen');
  if(d.type==='ending'){
    const got=Object.keys(meta.endings).length;
    el.innerHTML=`<h1>Tuesday.</h1>
      <div class="card"><span class="stamp">ENDING ${got}/4${d.fresh?' · NEW':''}</span><h2>${ENDINGS[d.k].name}</h2><p>${esc(d.text)}</p>
      <p style="color:var(--muted);font-size:.9rem">You broke the loop on loop #${meta.loops}.</p></div>
      <p class="tag">${got<4?'There are other ways out of Monday. Want to find them?':'You found every way out. You can finally rest. (Thanks for playtesting!)'}</p>
      <button class="btn primary" id="again">Wake up on Monday again<small>keep everything you know</small></button>
      <button class="btn" id="totitle" style="text-align:center">Back to title (switch sectors)</button>`;
  } else {
    el.innerHTML=`<h1>${fmt(Math.min(run.t,END))}</h1>
      <div class="card"><span class="stamp">LOOP #${meta.loops} OVER</span><p>${esc(d.text)}</p><p><b>${esc(d.reason)}</b></p>
      ${learnedThisLoop.length?`<div class="section-title">Learned this loop</div><ul class="journal">${learnedThisLoop.map(k=>`<li><span class="t">${KNOW[k].t}</span><br>${esc(KNOW[k].txt(S))}</li>`).join('')}</ul>`:`<p style="color:var(--muted)">You didn't learn anything new this time.</p>`}
      </div>
      <p class="tag">Final: Output ${run.out} · Standing ${run.std} · Sanity ${run.san}</p>
      <button class="btn primary" id="again">⏰ Wake up<small>${esc(S.wake)}</small></button>
      <button class="btn" id="totitle" style="text-align:center">Back to title</button>`;
  }
  document.getElementById('again').onclick=newRun;
  document.getElementById('totitle').onclick=titleScreen;
  window.scrollTo(0,0);
}

// hooks for automated playtesting
window.__od={audio:AudioSys, get run(){return run}, player, boss, meta:()=>meta, objects, openMenu, nearest, bossSees, playerExposed};
titleScreen();
</script>
